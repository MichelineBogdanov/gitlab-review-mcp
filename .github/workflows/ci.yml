name: Build and release

on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_version: ${{ steps.release_metadata.outputs.version }}
      release_tag: ${{ steps.release_metadata.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate release version
        id: release_metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$GITHUB_REF_NAME"
          if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vX.Y.Z without leading zeros: $release_tag" >&2
            exit 1
          fi

          project_version="$(mvn --quiet --batch-mode --no-transfer-progress \
            -Dstyle.color=never \
            -Dexpression=project.version \
            -DforceStdout \
            help:evaluate)"
          if [[ "$release_tag" != "v${project_version}" ]]; then
            echo "Release tag $release_tag does not match pom.xml version ${project_version}." >&2
            exit 1
          fi

          echo "version=${project_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Prepare distribution
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          set -euo pipefail

          bundle="gitlab-review-mcp-${RELEASE_VERSION}"
          mkdir -p "dist/${bundle}"
          cp target/gitlab-review-mcp.jar "dist/${bundle}.jar"
          cp target/gitlab-review-mcp.jar "dist/${bundle}/gitlab-review-mcp.jar"
          cp .env.example "dist/${bundle}/.env.example"
          cp .env.example dist/.env.example
          cp README.md "dist/${bundle}/README.md"
          cd dist
          zip -r "${bundle}.zip" "${bundle}"
          sha256sum "${bundle}.jar" "${bundle}.zip" .env.example > SHA256SUMS.txt

      - name: Upload distribution artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-review-mcp-${{ steps.release_metadata.outputs.version }}
          path: |
            dist/gitlab-review-mcp-${{ steps.release_metadata.outputs.version }}.jar
            dist/gitlab-review-mcp-${{ steps.release_metadata.outputs.version }}.zip
            dist/.env.example
            dist/SHA256SUMS.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gitlab-review-mcp-release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: gitlab-review-mcp-${{ needs.build.outputs.release_version }}
          path: dist

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail

          git fetch origin "+refs/heads/master:refs/remotes/origin/master"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$(git rev-parse origin/master)" != "$release_commit" ]]; then
            echo "Release tag $RELEASE_TAG must point to the current master commit." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; version tags are immutable." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "dist/gitlab-review-mcp-${RELEASE_VERSION}.jar" \
            "dist/gitlab-review-mcp-${RELEASE_VERSION}.zip" \
            dist/.env.example \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
